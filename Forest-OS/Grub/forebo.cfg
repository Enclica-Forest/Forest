# =============================================================================
# ForeB - Forest OS Canonical Boot Configuration
# =============================================================================
# This is the canonical boot configuration for Forest OS when ForeB is the
# default bootloader (ENABLE_FOREB_BOOTLOADER=yes). It uses a simple
# key=value format that is directly readable by ForeB's stage2 config parser
# (when enabled) and serves as the source of truth for the boot menu, kernel
# command line, and video defaults.
#
# GRUB's grub.cfg (in this same directory) is retained as a LEGACY fallback
# for UEFI scenarios or recovery; see Grub/README.md.
#
# Syntax:
#   - Lines beginning with '#' are comments.
#   - Keys are case-insensitive; values are literal strings/numbers.
#   - Boolean values: yes/no, true/false, 1/0.
#   - The [entry] sections define boot menu entries in display order.
# =============================================================================

# -----------------------------------------------------------------------------
# Global defaults (override config.h / build-config.mk at boot time when a
# stage2 config parser is enabled; otherwise these document the built-ins).
# -----------------------------------------------------------------------------
timeout         5               # Auto-boot countdown in seconds
default         0               # Default selected entry index (0-based)
bootloader      "ForeB Forest Bootloader v2.0"

# Video defaults for the kernel framebuffer (32bpp chain in config.h).
# ForeB's GUI menu renders in an 8bpp VBE mode; the kernel framebuffer mode
# is (re)selected from this chain after the menu choice.
video_width     1920
video_height    1080
video_bpp       32

# Fallback chain (tried in order if the preferred mode is unavailable):
#   1920x1080x32 -> 1280x720x32 -> 1024x768x32 -> 800x600x32 -> 640x480x32
#   -> VGA text mode 03h

# Disk layout (LBA sectors, 512 B each). MUST match config.h / the image build.
#   sector 0       : stage1 (MBR)
#   sectors 1..16  : stage2
#   sectors 17..32 : stage3
#   sector  48+    : kernel ELF image
kernel_sector   48
# initrd_sector  560             # Uncomment to enable initrd loading

# -----------------------------------------------------------------------------
# Boot menu entries
# -----------------------------------------------------------------------------
[entry]
label       "Forest OS (default)"
cmdline     ""
video       preferred            # use the video_* chain above
action      boot

[entry]
label       "Forest OS (no framebuffer)"
cmdline     "nofb"
video       text                 # VGA text mode 03h, no VBE LFB
action      boot

[entry]
label       "Forest OS (safe mode)"
cmdline     "safe"
video       preferred
action      boot

[entry]
label       "Reboot"
cmdline     ""
video       none
action      reboot

# =============================================================================
# Legacy GRUB compatibility note
# =============================================================================
# The kernel is handed a standard Multiboot1 info structure (EAX=0x2BADB002,
# EBX=&multiboot_info_t) so it boots identically under ForeB and GRUB. To
# chain-load GRUB instead, build ForeB with -DGRUB_CHAINLOAD_SECTOR=<n> and
# select a chain entry (not enabled by default in this config).
