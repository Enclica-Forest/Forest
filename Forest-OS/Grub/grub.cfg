menuentry "Forest OS (Text Console / nofb)" --class os {
    set gfxmode=text
    set gfxpayload=text
    terminal_output console
    echo "Loading Forest OS without framebuffer (VGA text console)..."
    multiboot2 /boot/kernel.bin nofb
    module2 /boot/initrd.tar
    boot
}

menuentry "Forest OS (Embedded + Text Console)" --class os {
    set gfxmode=text
    set gfxpayload=text
    terminal_output console
    echo "Loading Forest OS embedded mode without framebuffer..."
    multiboot2 /boot/kernel.bin embedded nofb
    module2 /boot/initrd.tar
    boot
}

