### ===============================
### Core Boot Settings
### ===============================

set default=0
set timeout=5
set timeout_style=menu

### ===============================
### Load Graphics + Input Modules
### ===============================

if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    insmod all_video
    insmod vbe
    insmod vga
fi

terminal_output gfxterm
terminal_input console mouse

### ===============================
### Graphics Configuration
### ===============================

# Prefer high resolutions with 32bpp, fall back safely
# gfxpayload tells GRUB what video mode to use for the kernel framebuffer
set gfxmode=1920x1080x32,1600x900x32,1366x768x32,1280x720x32,1024x768x32,800x600x32,auto
# Also apply this mode to GRUB's own display (not just kernel)
set gfxpayload=1920x1080x32,auto

### ===============================
### Menu Appearance (Text Only)
### ===============================

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

set color_normal=light-gray/black
set color_highlight=black/light-cyan

set quiet_boot=true

### ===============================
### Keyboard + Mouse Enhancements
### ===============================

insmod mouse
insmod keylayouts
keymap /boot/grub/keymaps/us.gkb

### ===============================
### Menu Entries
### ===============================

menuentry "Forest OS (Multiboot2)" --class os {
    set gfxpayload=1920x1080x32,auto
    echo "Loading Forest OS with Multiboot2..."
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.tar
    boot
}

menuentry "Forest OS (Multiboot1)" --class os {
    set gfxpayload=1920x1080x32,auto
    echo "Loading Forest OS with Multiboot1..."
    multiboot /boot/kernel.bin
    module /boot/initrd.tar
    boot
}

menuentry "Forest OS (Safe Mode)" --class os {
