# ============================================================================
#  forebo.cfg - ForeB bootloader configuration (grub.cfg-like)
# ============================================================================
#  Placed on the EFI System Partition at \forebo\forebo.cfg and parsed by the
#  UEFI loader (uefi/config.c) before the boot menu is shown. Lines starting
#  with '#' are comments. Blank lines are ignored.
#
#  Paths are ESP-absolute and may use '/' or '\' as the separator; both refer
#  to the same file on the FAT ESP (e.g. /forebo/kernel.elf).
#
#  Unknown keys are IGNORED by the parser, so this file stays forward- and
#  backward-compatible: an older ForeB build silently skips new keys.
# ============================================================================

# ============================================================================
#  Global settings (outside any menuentry block)
# ============================================================================

# timeout: seconds to count down before auto-booting the default entry.
#          0 = boot the default immediately (no menu wait).
timeout=60

# default: the entry pre-selected / auto-booted. Two forms:
#          default=2                       0-based index counting ONLY
#                                         top-level rows (submenu rows count)
#          default=CachyOS/linux-cachyos   path of titles (case-sensitive),
#                                         one per submenu level; quote it if
#                                         it contains spaces. A default that
#                                         lands on a submenu descends to its
#                                         first child. On any mismatch the
#                                         first top-level non-submenu row is
#                                         used instead.
default=0

# remember_last: when 1, ForeB persists every booted forest/linux/chainload
#                entry (its flat row index) in the UEFI variable
#                "ForeBLastEntry" and pre-selects it on the next boot
#                (overrides default=; any variable error falls back to
#                default=). Requires a firmware with writable NVRAM variables.
#remember_last=0

# background: default menu background image for ALL entries (a per-entry
#             background= inside a menuentry block is also accepted).
#             Supported: 24/32-bit uncompressed BMP, uncompressed TGA.
#             Scaled to fill the GOP framebuffer. See ASSETS.md.
background=/forebo/bg.bmp

# ---- Named theme preset. Reskins the whole menu (panel, text, selection,
#      particles, cursor, windows). One of:
#        forest (default) midnight nord dracula gruvbox solarized
#        amber matrix rose ocean mono
#      Any color_* key below overrides a single color on top of the preset. ---
theme=forest

# ---- Theme colors (0xRRGGBB). Omit any key to keep the built-in default. ---
color_bg=0x0E1A12          # desktop / menu background
color_fg=0xDDE7DE          # default text
color_accent=0x3FB56B      # highlights, progress bar, focus ring
color_sel_bg=0x1F5E3A      # selected menu row background
color_sel_fg=0xFFFFFF      # selected menu row text
color_titlebar=0x1F5E3A    # compositor window title bar
color_window=0x16241B      # compositor window client area
color_cursor=0xFFFFFF      # mouse cursor sprite fill

# ---- Input + compositor toggles -------------------------------------------
mouse_enabled=1            # poll Simple/Absolute pointer protocols
cursor_enabled=1           # draw the mouse cursor sprite
#cursor=/forebo/icons/cursor.tga  # optional cursor sprite (TGA w/ alpha);
                                  # off by default - the file must exist (falls
                                  # back to the drawn arrow if it does not)
animations=0              # fades / particles / spinner
double_buffer=1           # off-screen back buffer + single ui_present() flip
window_skin=beveled       # flat | beveled | glass

# ---- Menu STYLE ------------------------------------------------------------
#  menu_style picks one of 30 built-in layout presets; every detail below can
#  then be overridden individually so no two setups need look alike. Presets:
#    classic minimal terminal flat modern card neon outline underline invert
#    brackets sidebar-left sidebar-right banner-top dock-bottom fullscreen
#    centered compact spacious retro glass hacker ribbon framed dashed
#    spotlight pill boxed ghost elegant
menu_style=classic
#
#  Granular overrides (omit any to inherit from the preset):
#    menu_pos=center        # center|left|right|top|bottom|full|custom
#    menu_x= menu_y= menu_w= menu_h=   # permille (0..1000) of screen, custom pos
#    menu_entry_h=55        # row height, permille of screen height
#    menu_pad=14            # inner padding, px
#    menu_align=left        # left|center|right   (label alignment)
#    menu_selection=doublebar # bar|doublebar|box|outline|underline|arrow|
#                             #   bracket|invert|pill|gradient|glow|none
#    menu_border=thick      # none|thin|thick|double|shadow|glow|dashed
#    menu_corner=square     # square|round|cut
#    menu_accent_strip=1    # colored strip along the panel top
#    menu_dividers=0        # thin rule between rows
#    menu_gradient=1        # vertical gradient panel body
#    menu_shadow=1          # drop shadow under the panel
#    menu_title_bar=1       # "[ Boot Menu ]" header row
#    menu_show_title=1      # big centered scene title (drawn background only)
#    menu_show_footer=1     # key-hint footer line
#    menu_show_timer=1      # auto-boot countdown
#    menu_show_icons=1      # per-entry icons
#    menu_icon_side=right   # left|right
#    menu_scrollbar=1       # scrollbar when the list overflows
#    menu_caret=1           # ">" caret on the selected row

# ---- Buttons + UI elements (btn_* / ui_*) ---------------------------------
#  Every button and control (Settings dialog, tool windows, colour picker) obeys
#  these. Omit any key to inherit the built-in look.
#    btn_style=raised       # flat|raised|pill|outline|ghost|glass
#    btn_corner=round       # square|round|cut
#    btn_border=1           # outline width px
#    btn_pad_x=12  btn_pad_y=5  # label padding px
#    btn_gradient=1  btn_shadow=1  btn_glow=0
#    btn_fill=0x1C351C      btn_fill_hover=0x246B24   btn_fill_active=0x3FB56B
#    btn_fill_disabled=0x2A2A2A  # disabled-state face
#    btn_text=0xFFFFFF      btn_text_hover=0xFFFFFF   btn_text_active=0xFFFFFF
#    btn_border_color=0x285128   btn_focus_color=0x51CA3D
#    ui_window_corner=square  ui_window_border=1
#    ui_panel_alpha=255     # 0..255 window/panel opacity
#    ui_separator=0x285128  ui_scrollbar_w=6  ui_scrollbar_color=0x3FB56B
#    ui_focus_color=0x51CA3D  ui_focus_width=2  ui_font_scale=100

# ---- Visual effects (fx_*) -------------------------------------------------
#  Off by default (each forces a full-frame flip so it costs more on real HW).
#    fx_glass=0             # frosted-glass blur behind windows (window_skin=glass)
#    fx_blur=8              # backdrop blur radius px (0..32; >16 is capped in ui.c)
#    fx_opacity=72          # backdrop darken 0..255
#    fx_vignette=0          # screen-edge darken 0..255
#    fx_scanlines=0         # CRT scanline dim 0..255

# ---- Audio: PC speaker UI tones (pcspeaker / audio_*) ---------------------
#  Beeper only (no portable pre-OS PCM path exists). freq in Hz, ms duration.
#    pcspeaker=0            # master on/off (default off = silent)
#    audio_volume=80        # 0..100 (PWM gate duty; beeper has no real volume)
#    audio_nav_freq=880    audio_nav_ms=18       # menu Up/Down
#    audio_select_freq=1320 audio_select_ms=40   # Enter / activate
#    audio_open_freq=660   audio_open_ms=30      # window opened
#    audio_error_freq=220  audio_error_ms=90     # rejected action
#    audio_back_freq=494   audio_back_ms=22      # Esc / back

# ---- Window chrome ("CSS for windows") -------------------------------------
#  These override the window_skin= preset per-aspect. Colors are 0xRRGGBB. Any
#  key omitted inherits the preset/theme, so you can restyle just one detail.
#    win_title_h=-1            # title-bar height px, -1 = auto from font (or "auto")
#    win_title_fill=0x1F5E3A   # title bar background   (default: color_titlebar)
#    win_title_fg=0xFFFFFF     # title text             (default: color_sel_fg)
#    win_border_color=0x3FB56B # window frame           (default: color_accent)
#    win_border_w=1            # frame thickness px, -1 = auto (1)
#    win_corner=square         # square|round|cut
#    win_shadow=1              # drop shadow 0/1
#    win_close_color=0xB03030  # close-box fill
#    win_button_style=raised   # flat|raised|pill|outline|ghost|glass (window buttons)

# ---- Custom images anywhere (ESP-absolute TGA/BMP) -------------------------
#  Unset = the drawn look. Keep them modest in size (panel/window/titlebar/
#  button <= 4096px, cursor <= 64px): each is decoded into the boot-time pool.
#    img_background=/forebo/skin/bg.bmp      # menu background (overrides background=)
#    img_panel=/forebo/skin/panel.tga        # menu-panel face, tinted under the text
#    img_window=/forebo/skin/window.tga      # window client face
#    img_titlebar=/forebo/skin/titlebar.tga  # window title-bar face
#    img_button=/forebo/skin/button.tga      # button face
#    img_cursor=/forebo/skin/cursor.tga      # cursor sprite (alias of cursor=)
#  color_cursor= sets the arrow body colour when no img_cursor is used.

# ============================================================================
#  Menu entries
# ----------------------------------------------------------------------------
#  Each 'menuentry "Title" { ... }' block defines one boot option. The 'type='
#  key selects HOW it boots (defaults to 'forest' when omitted):
#      forest    Multiboot1 Forest kernel handoff (x86_64 only)
#      linux     EFI-stub vmlinuz + initrd (works on x64/ARM/RISC-V UEFI)
#      chainload LoadImage/StartImage another EFI bootloader (e.g. GRUB on USB)
#      shell     open the interactive ForeB shell window
#      recovery  open the Recovery / disk-tools window
#      tools     open the windowed GUI Tools launcher (Disk Info, GPT Viewer,
#                File Browser, Hex Viewer, Memory Map, EFI Variables, ...)
#      setup     reboot into the firmware/UEFI setup screen (alias: firmware)
#      settings  open the live Theme/Settings editor window (alias: theme)
#      reboot    firmware reset (RuntimeServices->ResetSystem)
#
#  ICONS: 'icon=' accepts either a full ESP path (/forebo/icons/os.tga) OR a
#  short NAME that resolves to /forebo/icons/<name>.tga. Names shipped by
#  tools/gen_assets.py: os, text, safe, gear, shield, reboot, ubuntu, debian,
#  arch, fedora, mint, tux, windows, grub, usb, disk, terminal.
#
#  SUBMENUS: 'submenu "Title" { ... }' groups entries under a collapsible
#  level (Limine-style). Enter/Right descends, Esc/Left goes back, and the
#  panel title shows a breadcrumb. Submenus nest up to 8 levels; 'icon=' on
#  a line inside the submenu block sets the submenu row's own icon.
#  Example (commented out):
#
#  submenu "CachyOS" {
#      icon=arch
#      menuentry "linux-cachyos" {
#          type=linux
#          vmlinuz=/vmlinuz-linux-cachyos
#          initrd=/initramfs-linux-cachyos.img
#          cmdline="root=UUID=<uuid> rw"
#          icon=arch
#      }
#      submenu "Snapshot 906" {
#          menuentry "linux-cachyos (906)" {
#              type=linux
#              vmlinuz=/vmlinuz-linux-cachyos
#              initrd=/initramfs-linux-cachyos.img
#              cmdline="root=UUID=<uuid> rw rootflags=subvol=/@/.snapshots/906/snapshot"
#              icon=safe
#          }
#      }
#  }
#
#  With the above, default=CachyOS/linux-cachyos (quote paths with spaces)
#  or default=0 (0 = first top-level row, i.e. the CachyOS submenu, which
#  then descends to its first child) both auto-boot linux-cachyos.
# ============================================================================

# ---- 1. Forest OS (Multiboot1 handoff) ------------------------------------
menuentry "Forest OS" {
    type=forest
    kernel=/forebo/kernel.elf
    module=/forebo/initrd.tar
    icon=os
    cmdline=""
}

menuentry "Forest OS (no framebuffer)" {
    type=forest
    kernel=/forebo/kernel.elf
    module=/forebo/initrd.tar
    icon=text
    cmdline="video=off console=ttyS0"
}

menuentry "Forest OS (safe mode)" {
    type=forest
    kernel=/forebo/kernel.elf
    # 'module2' is an accepted alias of 'module' (GRUB compat).
    module2=/forebo/initrd.tar
    module=/forebo/safe-overlay.tar
    icon=safe
    cmdline="single nomodeset noacpi"
}

# ---- 2. Linux distro via the EFI stub -------------------------------------
#  vmlinuz is loaded as an EFI-stub PE (LoadImage/StartImage). 'cmdline' is
#  passed as LoadOptions; 'initrd' is exposed to the kernel through the Linux
#  initrd media protocol (LINUX_EFI_INITRD_MEDIA_GUID + LoadFile2). Point
#  root= at your real root device/UUID.
menuentry "Linux (vmlinuz)" {
    type=linux
    vmlinuz=/forebo/vmlinuz
    initrd=/forebo/initrd.img
    icon=tux
    cmdline="root=/dev/sda2 ro quiet loglevel=3"
}

# ---- 3. Chainload GRUB from a live USB stick ------------------------------
#  Switch to another bootloader. If 'chain' names a file, ForeB LoadImage's it
#  directly. If 'chain' is EMPTY and type=chainload, ForeB auto-scans every
#  SimpleFileSystem/BlockIo volume (including USB) for a standard EFI loader
#  (\EFI\BOOT\BOOTX64.EFI, \EFI\*/grubx64.efi) and boots the first it finds.
menuentry "Chainload GRUB (USB)" {
    type=chainload
    chain=/EFI/BOOT/BOOTX64.EFI
    icon=grub
}

menuentry "Boot removable device (auto-scan)" {
    type=chainload
    # chain left blank -> scan all volumes for an EFI bootloader.
    icon=usb
}

# type=windows is a chainload alias: it auto-defaults chain= to the standard
# Windows Boot Manager (/EFI/Microsoft/Boot/bootmgfw.efi). Uncomment to boot an
# installed Windows. An explicit chain= line still overrides the default path.
#menuentry "Windows" {
#    type=windows          # -> chain=/EFI/Microsoft/Boot/bootmgfw.efi (auto)
#    icon=windows
#}

# ---- 4. Built-in tools (open as compositor windows) -----------------------
menuentry "ForeB Shell" {
    type=shell
    icon=terminal
}

menuentry "Recovery / Disk Tools" {
    type=recovery
    icon=gear
}

# GUI Tools launcher: Disk Info, GPT Viewer, Partition/File Browser, Hex Viewer,
# Memory Map, EFI Variables, Boot Manager, System Info, Settings, Key Tester.
menuentry "Tools" {
    type=tools
    icon=gear
}

# Live theme / colour / style editor with an interactive RGB colour picker.
# Also reachable anytime by pressing 'S' in the menu.
menuentry "Settings" {
    type=settings
    icon=gear
}

# UEFI firmware settings (accessible from within the bootloader).
# View BootOrder, BootNext, Secure Boot state, and more without rebooting.
# Also reachable anytime by pressing 'U' in the menu.
menuentry "UEFI Firmware Settings" {
    type=uefi_settings
    icon=settings
}

# ---- 5. Firmware / UEFI setup ---------------------------------------------
#  Sets the OsIndications runtime variable (EFI_OS_INDICATIONS_BOOT_TO_FW_UI)
#  then cold-resets into the firmware setup screen. Only works if the firmware
#  advertises support in OsIndicationsSupported; otherwise ForeB reports it and
#  stays in the menu.
menuentry "Firmware Setup (UEFI)" {
    type=setup
    icon=settings
}

# ---- 6. Reboot ------------------------------------------------------------
menuentry "Reboot" {
    type=reboot
    icon=reboot
    # Legacy alias 'kernel=reboot' still works and maps to type=reboot.
}
