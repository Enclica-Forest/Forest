# GRUB test fixture for forebo-install --selftest (best-effort parser)
set default=0
set timeout=10

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Ubuntu 24.04 LTS' --class ubuntu --class gnu-linux --class os $menuentry_id_option 'gnulinux-simple-9d3a1111' {
	recordfail
	savedefault
	load_video
	insmod gzio
	insmod part_gpt
	insmod fat
	search --no-floppy --fs-uuid --set=root 58FA-9C21
	linux	/vmlinuz-6.8.0-41-generic root=UUID=9d3a1111-2222-3333-4444-555566667777 ro quiet splash
	initrd	/initrd.img-6.8.0-41-generic
}
submenu 'Advanced options for Ubuntu' {
	menuentry 'Ubuntu, with Linux 6.8.0-41-generic (recovery mode)' --class ubuntu --class os {
		load_video
		insmod gzio
		search --no-floppy --fs-uuid --set=root 58FA-9C21
		linux	/vmlinuz-6.8.0-41-generic root=UUID=9d3a1111-2222-3333-4444-555566667777 ro recovery nomodeset
		initrd	/initrd.img-6.8.0-41-generic
	}
}
### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/30_os-prober ###
menuentry "Windows Boot Manager (on /dev/nvme0n1p1)" --class windows --class os $menuentry_id_option 'osprober-efi-A1B2-C3D4' {
	insmod part_gpt
	insmod fat
	search --no-floppy --fs-uuid --set=root A1B2-C3D4
	chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
### END /etc/grub.d/30_os-prober ###
